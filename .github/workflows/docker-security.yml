name: Docker Image Security Scan
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
 
permissions:
  contents: read
jobs:
  docker-security:
    name: Docker Vulnerability Scan
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
 
      - name: Build Docker image
        run: |
          docker build --no-cache \
            -t banking-api:${{ github.sha }} \
            ./application

      - name: Verify Python dependencies
        run: |
          docker run --rm banking-api:${{ github.sha }} \
            python -m pip show wheel jaraco.context
 
          docker run --rm banking-api:${{ github.sha }} \
            sh -c 'python -m pip show wheel | grep "^Version:" && python -m pip show jaraco.context | grep "^Version:"'

 
      - name: Verify image exists
        run: |
          docker images banking-api
          docker image inspect banking-api:${{ github.sha }} --format '{{.Id}}'
 
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: banking-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  
